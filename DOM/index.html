<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Jam #4</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="flex justify-center items-center h-screen bg-gray-100">
    <section class="space-y-7 text-center">
      <div>
        <label id="label" class="font-medium text-8xl">0</label>
      </div>
      <div>
        <button
          id="btnKurang"
          onclick="kurangBtn()"
          class="bg-orange-400 px-3 py-2 rounded-sm hover:bg-orange-600 transition ease-in-out duration-300"
        >
          Kurang
        </button>
        <button
          id="btnReset"
          onclick="resetBtn()"
          class="bg-black text-white px-3 py-2 rounded-sm hover:bg-gray-500 transition ease-in-out duration-300"
        >
          Reset
        </button>
        <button
          id="btnTambah"
          onclick="tambahBtn()"
          class="bg-orange-400 px-3 py-2 rounded-sm hover:bg-orange-600 transition ease-in-out duration-300"
        >
          Tambah
        </button>
        <button
          id="btnTambah10"
          onclick="tambahBtn10()"
          class="bg-orange-400 px-3 py-2 rounded-sm hover:bg-orange-600 transition ease-in-out duration-300"
        >
          +10
        </button>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
